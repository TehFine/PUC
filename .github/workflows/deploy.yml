name: Auto Deploy to Cloud Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Xếp hàng tuần tự nếu push nhiều commit liên tiếp, tránh 2 tiến trình build chạy đè nhau trên máy chủ
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Restart Docker on Cloud Server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Kiểm tra cấu hình GitHub Secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::Chưa cấu hình SERVER_HOST hoặc SERVER_SSH_KEY trong GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Kết nối SSH và cập nhật Docker Compose trên máy chủ
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          SERVER_PORT="${SERVER_PORT:-24700}"
          SERVER_USER="${SERVER_USER:-deploy}"
          trap 'rm -f ~/.ssh/deploy_key' EXIT

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            ssh-keyscan -T 10 -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          GIT_AUTH_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"

          {
            printf 'GIT_AUTH_B64=%q\nREPO_SLUG=%q\n' "$GIT_AUTH_B64" "$REPO_SLUG"
            cat << 'EOF'
          set -euo pipefail
          cd /opt/puc

          echo "[deploy] Đồng bộ mã nguồn nhánh main từ GitHub..."
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0="safe.directory"
          export GIT_CONFIG_VALUE_0="/opt/puc"
          export GIT_CONFIG_KEY_1="credential.helper"
          export GIT_CONFIG_VALUE_1=""
          export GIT_CONFIG_KEY_2="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_2="AUTHORIZATION: basic ${GIT_AUTH_B64}"

          git fetch --force "https://github.com/${REPO_SLUG}.git" main
          git reset --hard FETCH_HEAD
          git update-ref refs/remotes/origin/main FETCH_HEAD || true

          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 \
                GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1 \
                GIT_CONFIG_KEY_2 GIT_CONFIG_VALUE_2 GIT_AUTH_B64

          echo "[deploy] Biên dịch và khởi động lại Docker Compose..."
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build --remove-orphans
          docker compose --env-file .env.prod -f docker-compose.prod.yml restart nginx
          docker image prune -f

          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1/api/health >/dev/null 2>&1 && curl -fsS -o /dev/null http://127.0.0.1/ 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done

          docker compose --env-file .env.prod -f docker-compose.prod.yml ps
          if [ "$ok" -ne 1 ]; then
            echo "::error::Trang giao diện hoặc API chưa phản hồi HTTP 200 sau khi khởi động lại."
            docker compose --env-file .env.prod -f docker-compose.prod.yml logs --tail=80 frontend backend nginx
            exit 1
          fi
          echo "[deploy] Hoàn tất triển khai thành công."
          EOF
          } | ssh -T -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o StrictHostKeyChecking=yes "${SERVER_USER}@${SERVER_HOST}" /bin/bash -s


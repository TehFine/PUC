services:
  db:
    image: postgis/postgis:17-3.5
    container_name: puc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-puc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Can khai bao POSTGRES_PASSWORD trong .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-puc_cune}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - puc-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-puc_user} -d $${POSTGRES_DB:-puc_cune}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: puc-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-puc_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-puc_cune}
      DATABASE_SSL: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Can khai bao JWT_ACCESS_SECRET trong .env.prod}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Can khai bao TOTP_ENCRYPTION_KEY trong .env.prod}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "1"
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-20}
    volumes:
      - puc-uploads:/app/uploads
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://backend:4000
    container_name: puc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://backend:4000
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: puc-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      SSL_DOMAIN: ${SSL_DOMAIN:-htxcune.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/start-nginx.sh:/etc/nginx/puc-start.sh:ro
      - ./nginx/default.conf:/etc/nginx/puc-http.conf.template:ro
      - ./nginx/https.conf.template:/etc/nginx/puc-https.conf.template:ro
      - puc-certbot-conf:/etc/letsencrypt:ro
      - puc-certbot-www:/var/www/certbot:ro
    command: ["/bin/sh", "/etc/nginx/puc-start.sh"]

  certbot:
    image: certbot/certbot:latest
    container_name: puc-certbot
    restart: unless-stopped
    volumes:
      - puc-certbot-conf:/etc/letsencrypt
      - puc-certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  puc-db-data:
  puc-uploads:
  puc-certbot-conf:
  puc-certbot-www:

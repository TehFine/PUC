server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    client_max_body_size 25M;

    # Mở rộng bộ đệm đọc header phản hồi (Next.js gửi kèm CSP nonce + Link preload phông chữ vượt mức 4k mặc định của Nginx)
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Dùng DNS nội bộ của Docker (127.0.0.11) để tự cập nhật IP mới khi container frontend/backend được build lại
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Phục vụ xác thực tên miền HTTP-01 của Let's Encrypt (Certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Kênh đẩy thông báo thời gian thực (SSE): tắt bộ đệm để chuyển tiếp tức thời
    location = /api/notifications/stream {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Chuyển thẳng mọi yêu cầu API sang container NestJS Backend
    location /api/ {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Chuyển giao diện người dùng sang container Next.js Frontend
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

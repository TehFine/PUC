<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <defs>
    <clipPath id="scene-clip">
      <path d="M44 106C32 68 62 32 104 36C124 38 138 48 156 42C188 31 232 46 242 84C252 122 234 176 186 194C144 210 86 206 56 172C38 152 52 131 44 106Z" />
    </clipPath>
  </defs>

  <!-- Nền mây hữu cơ xanh bạc hà nhạt -->
  <path
    d="M44 106C32 68 62 32 104 36C124 38 138 48 156 42C188 31 232 46 242 84C252 122 234 176 186 194C144 210 86 206 56 172C38 152 52 131 44 106Z"
    fill="#EAF6F2"
  />

  <g clip-path="url(#scene-clip)">
    <!-- Đồi phụ phía xa bên phải -->
    <circle cx="212" cy="142" r="24" fill="#9BDAC5" />
    <circle cx="206" cy="136" r="8" fill="#BCE9DA" opacity="0.65" />

    <!-- Đồi cỏ xanh ngọc chủ đạo phía dưới -->
    <path
      d="M20 156C72 132 162 124 260 134V220H20V156Z"
      fill="#52B69A"
    />

    <!-- Bóng đổ nhẹ trên mặt đồi -->
    <ellipse cx="142" cy="154" rx="54" ry="8" fill="#3D9A80" opacity="0.35" />
  </g>

  <!-- Nửa khung trang bên trái (nghiêng nhẹ -8 độ) -->
  <g transform="translate(82 78) rotate(-8)">
    <rect x="0" y="0" width="54" height="68" rx="6" fill="#FFFFFF" stroke="#52B69A" stroke-width="2" />
    <path d="M1 6C1 3.23858 3.23858 1 6 1H53V14H1V6Z" fill="#76CBB2" />
    <rect x="7" y="5.5" width="14" height="3" rx="1.5" fill="#FFFFFF" />
    <rect x="8" y="21" width="34" height="8" rx="2" fill="#D5F1E8" />
    <rect x="8" y="34" width="28" height="6" rx="2" fill="#EAF6F2" />
    <rect x="8" y="44" width="36" height="14" rx="2" fill="#D5F1E8" />
    <!-- Đường rạn zig-zag cạnh phải -->
    <path d="M54 0L46 18L55 36L45 52L54 68" fill="#EAF6F2" />
    <path d="M54 0L46 18L55 36L45 52L54 68" stroke="#52B69A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Nửa khung trang bên phải (nghiêng nhẹ +6 độ) -->
  <g transform="translate(145 72) rotate(6)">
    <rect x="0" y="0" width="48" height="68" rx="6" fill="#FFFFFF" stroke="#52B69A" stroke-width="2" />
    <path d="M0 1H42C44.7614 1 47 3.23858 47 6V14H0V1Z" fill="#76CBB2" />
    <circle cx="39" cy="7.5" r="2" fill="#FFFFFF" />
    <circle cx="33" cy="7.5" r="2" fill="#FFFFFF" opacity="0.75" />
    <rect x="8" y="21" width="31" height="16" rx="2" fill="#D5F1E8" />
    <rect x="8" y="42" width="24" height="6" rx="2" fill="#EAF6F2" />
    <rect x="8" y="52" width="31" height="8" rx="2" fill="#D5F1E8" />
    <!-- Đường rạn cạnh trái khớp sang -->
    <path d="M0 0L7 19L-2 36L8 52L0 68" stroke="#52B69A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Huy hiệu tròn nhỏ điểm nhấn ở góc thẻ trái -->
  <circle cx="94" cy="128" r="11" fill="#3B9B80" stroke="#FFFFFF" stroke-width="2.5" />
  <path d="M94 123V129" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="94" cy="133" r="1.3" fill="#FFFFFF" />

  <!-- Đường bay nét đứt nhẹ và cánh bướm lá xanh bay lên -->
  <path
    d="M181 66C181 55 186 48 193 42"
    stroke="#76CBB2"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-dasharray="3 3"
  />
  <g transform="translate(197 32) rotate(-18)">
    <path d="M0 6C-6 0 -10 3 -7 9C-4 13 0 10 0 6Z" fill="#3B9B80" />
    <path d="M1 6C7 0 11 3 8 9C5 13 1 10 1 6Z" fill="#68C3A8" />
  </g>

  <!-- Hạt trang trí tối giản cân bằng bố cục -->
  <circle cx="68" cy="96" r="2.2" fill="#76CBB2" />
  <circle cx="212" cy="86" r="2.5" fill="#9BDAC5" />
</svg>

